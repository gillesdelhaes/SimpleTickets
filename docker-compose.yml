services:
  db:
    build: ./db
    restart: unless-stopped
    # Caps sized for a small single-VM deployment — one team's worth of
    # tickets, not a multi-tenant SaaS. Raise if the host has room to spare;
    # the point is stopping one runaway container from starving the others.
    mem_limit: 512m
    cpus: 1.0
    environment:
      POSTGRES_DB: simpletickets
      POSTGRES_USER: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Postgres password — generated on first boot, persisted here, shared
      # read-only with api. Its own volume for the same reason as app_secret
      # below: never in the same failure domain as the data it protects.
      - db_secret:/data/db-secret
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # postgres's own entrypoint starts as root to chown the data dir, then
      # de-escalates to the postgres user via gosu — needs these to do that,
      # nothing broader.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simpletickets"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: ./backend
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - attachments:/data/attachments
      # Master encryption key — deliberately its own volume, separate from
      # Postgres, so a leaked DB backup/snapshot doesn't also hand over the
      # key that decrypts every other stored secret. See app/bootstrap.py.
      - app_secret:/data/secret
      # Same db_secret volume as db, read-only — api reads the generated
      # password to build DATABASE_URL itself (see backend/entrypoint.sh).
      - db_secret:/data/db-secret:ro
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build: ./frontend
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    ports:
      - "3000:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      # Optional: drop fullchain.pem + privkey.pem in here to serve HTTPS
      # directly (see README "TLS"). Empty/missing — the default — falls
      # back to plain HTTP on :80 only; nothing listens on :443 in that
      # case, so publishing the port above is harmless either way.
      - ./certs:/etc/nginx/certs:ro
    networks:
      - internal
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
      # nginx-entrypoint.sh writes the chosen (TLS or plain-HTTP) config
      # here at container start — needs to be writable despite read_only.
      - /etc/nginx/conf.d
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # nginx's master process binds port 80/443 and chowns cache/temp dirs
      # as root, then each worker drops to the nginx user — the full set
      # that start-as-root-then-de-escalate dance needs, nothing broader.
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  attachments:
  app_secret:
  db_secret:
