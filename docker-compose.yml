services:
  db:
    build: ./db
    restart: unless-stopped
    environment:
      POSTGRES_DB: simpletickets
      POSTGRES_USER: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Postgres password — generated on first boot, persisted here, shared
      # read-only with api. Its own volume for the same reason as app_secret
      # below: never in the same failure domain as the data it protects.
      - db_secret:/data/db-secret
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simpletickets"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - attachments:/data/attachments
      # Master encryption key — deliberately its own volume, separate from
      # Postgres, so a leaked DB backup/snapshot doesn't also hand over the
      # key that decrypts every other stored secret. See app/bootstrap.py.
      - app_secret:/data/secret
      # Same db_secret volume as db, read-only — api reads the generated
      # password to build DATABASE_URL itself (see backend/entrypoint.sh).
      - db_secret:/data/db-secret:ro
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  attachments:
  app_secret:
  db_secret:
