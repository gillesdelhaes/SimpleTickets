# Plain HTTP — used when no TLS cert is mounted at /etc/nginx/certs (see
# nginx-entrypoint.sh). Not safe to expose directly on a corporate network;
# either mount a cert (see tls.conf) or put this behind your own
# TLS-terminating reverse proxy/load balancer. See README "TLS".
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        image/svg+xml font/woff font/woff2;
    gzip_min_length 1024;

    include /etc/nginx/locations.conf;
}
