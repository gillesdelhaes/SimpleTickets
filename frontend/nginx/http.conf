# Plain HTTP — used when no TLS cert is mounted at /etc/nginx/certs (see
# nginx-entrypoint.sh). Not safe to expose directly on a corporate network;
# either mount a cert (see tls.conf) or put this behind your own
# TLS-terminating reverse proxy/load balancer. See README "TLS".

# Path only, no query string — search terms and admin's email-search
# queries land in the query string (GET requests), and this is a proxy
# whose access log a corporate deployment may ship to log aggregation.
log_format no_query '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log no_query;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        image/svg+xml font/woff font/woff2;
    gzip_min_length 1024;

    include /etc/nginx/locations.conf;
}
