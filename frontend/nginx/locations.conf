# Shared request-routing rules — included by both http.conf (no TLS certs
# mounted) and tls.conf (certs found at /etc/nginx/certs), so the two never
# drift out of sync with each other.

# Long-lived cache for hashed static assets (Vite fingerprints them)
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Backup restore accepts whole-instance archives (backend caps at 500 MB).
# Longest-prefix match means this wins over the /api/ block below for restore
# uploads, without loosening the 15 MB limit on everyday attachment uploads.
location = /api/admin/restore {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 500m;
}

# Proxy all API requests to the FastAPI backend
location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    # Raise body limit for file uploads (matches ATTACHMENT_MAX_SIZE_MB)
    client_max_body_size 15m;
}

# SPA fallback — unknown paths served by index.html for React Router
location / {
    try_files $uri $uri/ /index.html;
    # index.html must not be cached so deploys take effect immediately
    add_header Cache-Control "no-store, no-cache, must-revalidate";
}
